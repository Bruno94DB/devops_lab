controller:
  service:
    type: LoadBalancer
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
  extraArgs:
    enable-ssl-passthrough: ""
  config:
    use-forwarded-headers: "true"
    allow-snippet-annotations: "true"
    server-snippet: |
      proxy_hide_header Strict-Transport-Security;
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
