apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ingresses
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Bruno94DB/devops_lab.git
    targetRevision: HEAD
    path: apps/platform-ingresses
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
